  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--linha); vertical-align: top; }
  th { font-size: .85rem; font-weight: 500; color: var(--suave); }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th.num { text-align: right; }
  .preco { font-weight: 600; }
  .desce { color: var(--desce); } .sobe { color: var(--sobe); }
  a { color: var(--acento); }
  a:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .grelha { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--papel); border: 1px solid var(--linha); border-radius: 6px; padding: 14px; }
  figcaption { font-size: .9rem; margin-bottom: 8px; }
  figcaption span { display: block; color: var(--suave); font-size: .8rem; }
  .grafico { position: relative; height: 180px; }
  .vazio { color: var(--suave); }
  .estado { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cor); }
  .e-stock { --cor: var(--desce); } .e-esgotado { --cor: var(--sobe); }
  .e-encomenda, .e-prevenda { --cor: #c08a1e; } .e-desconhecido { --cor: var(--suave); }
  tr.esgotado td:not(:last-child) { color: var(--suave); }
  section + section { margin-top: 56px; padding-top: 8px; border-top: 1px solid var(--linha); }
  h2.produto { font: 600 clamp(1.6rem, 4vw, 2.2rem)/1.1 "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; margin: 32px 0 6px; }
  h3 { font-size: 1.05rem; font-weight: 600; margin: 28px 0 12px; }
  .legenda { color: var(--suave); font-size: .85rem; margin: 8px 0 0; }
</style>
</head>

  const sec = el("section");
  sec.append(el("h2", "produto", produto));
  sec.append(el("p", "resumo", !todas.length ? "Não encontrado na leitura de hoje."
    : `${todas.length} ${todas.length === 1 ? "artigo" : "artigos"}, ${emStock.length} em stock` +
      (emStock.length ? `; o mais barato em stock custa ${eur(emStock[emStock.length - 1].ultimo.preco)}.` : ".")));
  raiz.append(sec);
  if (!todas.length) continue;

  sec.append(el("h3", null, "Hoje, do mais caro ao mais barato"));
  const wrap = el("div", "tabela");
  wrap.innerHTML = `<table><thead><tr><th>Artigo</th><th>Estado</th><th class="num">Preço</th><th class="num">Desde a última leitura</th><th class="num">Mínimo registado</th></tr></thead><tbody></tbody></table>`;
  const tbody = wrap.querySelector("tbody");
  for (const s of todas) {
    const ant = s.pontos.length > 1 ? s.pontos[s.pontos.length - 2].preco : null;
    const dif = ant === null ? null : s.ultimo.preco - ant;
    const minimo = Math.min(...s.pontos.map(p => p.preco));
    const tr = document.createElement("tr");
    if (s.ultimo.estado === "Esgotado") tr.className = "esgotado";
    tr.innerHTML = `
      <td><a href="${s.url}" target="_blank" rel="noopener"></a></td>
      <td><span class="estado ${classe(s.ultimo.estado)}">${s.ultimo.estado}</span></td>
      <td class="num preco">${eur(s.ultimo.preco)}</td>
      <td class="num ${dif < 0 ? "desce" : dif > 0 ? "sobe" : ""}">${dif === null ? "Primeira leitura" : dif === 0 ? "Igual" : (dif > 0 ? "+" : "−") + eur(Math.abs(dif))}</td>
      <td class="num">${eur(minimo)}</td>`;
    tr.querySelector("a").textContent = s.nome;
    tbody.append(tr);
  }
  sec.append(wrap);

  sec.append(el("h3", null, "Evolução do preço"));
  const grelha = el("div", "grelha");
  sec.append(grelha);
  for (const s of todas) {
    const fig = document.createElement("figure");
    fig.innerHTML = `<figcaption></figcaption><div class="grafico"><canvas></canvas></div>`;
    fig.querySelector("figcaption").innerHTML = `<span><span class="estado ${classe(s.ultimo.estado)}">${s.ultimo.estado}</span></span>`;
    fig.querySelector("figcaption").prepend(document.createTextNode(s.nome));
    grelha.append(fig);
    if (typeof Chart === "undefined") continue;
    new Chart(fig.querySelector("canvas"), {
      type: "line",
      data: {
        labels: s.pontos.map(p => new Date(p.data + "T12:00:00").toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit" })),
        datasets: [{ data: s.pontos.map(p => p.preco), borderColor: css("--acento"), backgroundColor: css("--acento"),
          borderWidth: 2, stepped: true,
          pointRadius: s.pontos.map(p => p.estado === "Em stock" ? (s.pontos.length > 30 ? 0 : 3) : 3),
          pointBackgroundColor: s.pontos.map(p => p.estado === "Em stock" ? css("--acento") : css("--papel")) }]
      },
      options: {
        maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${eur(c.parsed.y)} (${s.pontos[c.dataIndex].estado})` } } },
        scales: {
          x: { ticks: { color: css("--suave"), maxTicksLimit: 6 }, grid: { display: false } },
          y: { ticks: { color: css("--suave"), callback: v => eur(v) }, grid: { color: css("--linha") } }
        }
      }
    });
  }
}
</script>
</body>
</html>
